services:
  bot:
    build: .
    image: alovpn-bot
    container_name: alovpn-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # منطقه زمانی کانتینر (برای زمان‌بند و لاگ‌ها)
      TZ: ${TIMEZONE:-Asia/Tehran}
    volumes:
      # ولوم نام‌دار: مستقل از یوزر هاست، توسط appuser قابل نوشتن است
      - bot_data:/app/data

volumes:
  bot_data:
